name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'style.css'
      - 'privacy.html'
      - 'terms.html'
      - 'images/**'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Sync to S3 + Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # Configure AWS credentials via OIDC
      #
      # All values below are sourced from Terraform outputs:
      #   - role-to-assume   → secrets.AWS_ROLE_ARN
      #   - aws-region       → vars.AWS_REGION  (falls back to eu-north-1)
      #   - S3 bucket name   → secrets.S3_BUCKET_NAME
      #   - CloudFront ID    → secrets.CLOUDFRONT_DISTRIBUTION_ID
      # --------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      # Sync site files to S3 (excludes terraform/, .git/, .github/, etc.)
      - name: Sync site to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_NAME }} \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".claude/*" \
            --exclude "terraform/*" \
            --exclude ".mcp.json" \
            --exclude "*.md" \
            --exclude "CLAUDE.md"

      # Invalidate CloudFront cache so updated files are served immediately
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"